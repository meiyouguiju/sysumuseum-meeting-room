spring:
  application:
    name: museum-meeting-room-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:museum_meeting_room}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=false
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 3 * * *"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

maintenance:
  scheduling:
    enabled: true
  slot-cleanup:
    cron: "0 2,32 * * * *"
    batch-size: 500
  idempotency:
    processing-recovery-cron: "0 * * * * *"
    processing-recovery-threshold: PT2M
    processing-recovery-batch-size: 100
    cleanup-cron: "0 17 * * * *"
    cleanup-batch-size: 500
